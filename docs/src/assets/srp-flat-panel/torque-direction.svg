<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="ui-sans-serif, system-ui, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif">
  <rect width="980" height="470" fill="#fbfbfd"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker>
    <marker id="old" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/></marker>
    <marker id="new" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6fb2"/></marker>
    <marker id="comp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7f8c8d"/></marker>
    <marker id="sun" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d99a2b"/></marker>
  </defs>
  <text x="24" y="30" font-size="15" fill="#111" font-weight="600">同じ力の誤りが、圧力中心の位置で違う形で現れる</text>
  <text x="24" y="52" font-size="12" fill="#555">&#964; = r &#215; F、r は重心から圧力中心へのずれ。&#964; の向きは衛星が回る軸を表す</text>
  <text x="256" y="88" font-size="13.5" fill="#111" font-weight="600" text-anchor="middle">圧力中心が平面内</text>
  <text x="256" y="108" font-size="12.5" fill="#1f6fb2" text-anchor="middle">回る軸は同じ、大きさだけ違う</text>
  <polygon points="151.1,289.0 360.9,357.4 360.9,175.0 151.1,106.6" fill="#eef2f7" stroke="#c9d4e2" stroke-width="1.1"/>
  <line x1="256.0" y1="232.0" x2="295.6" y2="201.9" stroke="#93a3b5" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="301" y="198" font-size="12" fill="#7a8ca0" font-style="italic">s&#770;</text>
  <line x1="256.0" y1="232.0" x2="256.0" y2="171.2" stroke="#93a3b5" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="261" y="167" font-size="12" fill="#7a8ca0" font-style="italic">n&#770;</text>
  <circle cx="256" cy="232" r="6" fill="none" stroke="#6a3fa0" stroke-width="2"/>
  <line x1="250" y1="232" x2="262" y2="232" stroke="#6a3fa0" stroke-width="1.6"/>
  <line x1="256" y1="226" x2="256" y2="238" stroke="#6a3fa0" stroke-width="1.6"/>
  <text x="192" y="218" font-size="12.5" fill="#6a3fa0" font-weight="600">重心</text>
  <line x1="256.0" y1="232.0" x2="339.9" y2="259.4" stroke="#2e7d32" stroke-width="2.4" marker-end="url(#ar)"/>
  <text x="296" y="238" font-size="13.5" fill="#2e7d32" font-weight="600" font-style="italic">r</text>
  <polygon points="330.3,246.1 372.3,259.8 349.5,272.6 307.5,258.9" fill="#dfe6ee" stroke="#111" stroke-width="2"/>
  <circle cx="339.9" cy="259.4" r="3.4" fill="#c2185b"/>
  <text x="316" y="293" font-size="12.5" fill="#c2185b" font-weight="600">圧力中心</text>
  <line x1="339.9" y1="259.4" x2="306.7" y2="284.6" stroke="#c0392b" stroke-width="1.8" marker-end="url(#old)" stroke-dasharray="6 3"/>
  <line x1="339.9" y1="259.4" x2="322.2" y2="284.7" stroke="#1f6fb2" stroke-width="2.2" marker-end="url(#new)"/>
  <text x="336" y="321" font-size="11.5" fill="#777">F 旧 / 修正後</text>
  <line x1="256.0" y1="232.0" x2="222.9" y2="250.5" stroke="#c0392b" stroke-width="2.6" marker-end="url(#old)" stroke-dasharray="7 4"/>
  <text x="187" y="243" font-size="12.5" fill="#c0392b" font-weight="600">&#964; 旧</text>
  <line x1="256.0" y1="232.0" x2="227.4" y2="248.0" stroke="#1f6fb2" stroke-width="3.2" marker-end="url(#new)"/>
  <text x="153" y="264" font-size="12.5" fill="#1f6fb2" font-weight="600">&#964; 修正後</text>
  <text x="256" y="372" font-size="12.5" fill="#111" font-weight="600" text-anchor="middle">軸のなす角 0.0&#176;、大きさは旧式の 0.86 倍</text>
  <text x="712" y="88" font-size="13.5" fill="#111" font-weight="600" text-anchor="middle">圧力中心が平面外</text>
  <text x="712" y="108" font-size="12.5" fill="#1f6fb2" text-anchor="middle">回る軸そのものが違う</text>
  <polygon points="607.1,289.0 816.9,357.4 816.9,175.0 607.1,106.6" fill="#eef2f7" stroke="#c9d4e2" stroke-width="1.1"/>
  <line x1="712.0" y1="232.0" x2="751.6" y2="201.9" stroke="#93a3b5" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="757" y="198" font-size="12" fill="#7a8ca0" font-style="italic">s&#770;</text>
  <line x1="712.0" y1="232.0" x2="712.0" y2="171.2" stroke="#93a3b5" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="717" y="167" font-size="12" fill="#7a8ca0" font-style="italic">n&#770;</text>
  <circle cx="712" cy="232" r="6" fill="none" stroke="#6a3fa0" stroke-width="2"/>
  <line x1="706" y1="232" x2="718" y2="232" stroke="#6a3fa0" stroke-width="1.6"/>
  <line x1="712" y1="226" x2="712" y2="238" stroke="#6a3fa0" stroke-width="1.6"/>
  <text x="648" y="218" font-size="12.5" fill="#6a3fa0" font-weight="600">重心</text>
  <line x1="712.0" y1="232.0" x2="664.5" y2="258.6" stroke="#2e7d32" stroke-width="2.4" marker-end="url(#ar)"/>
  <text x="680" y="238" font-size="13.5" fill="#2e7d32" font-weight="600" font-style="italic">r</text>
  <polygon points="654.9,245.4 696.9,259.1 674.1,271.8 632.1,258.1" fill="#dfe6ee" stroke="#111" stroke-width="2"/>
  <circle cx="664.5" cy="258.6" r="3.4" fill="#c2185b"/>
  <text x="640" y="293" font-size="12.5" fill="#c2185b" font-weight="600">圧力中心</text>
  <line x1="664.5" y1="258.6" x2="631.3" y2="283.8" stroke="#c0392b" stroke-width="1.8" marker-end="url(#old)" stroke-dasharray="6 3"/>
  <line x1="664.5" y1="258.6" x2="646.8" y2="283.9" stroke="#1f6fb2" stroke-width="2.2" marker-end="url(#new)"/>
  <text x="660" y="321" font-size="11.5" fill="#777">F 旧 / 修正後</text>
  <line x1="712.0" y1="232.0" x2="648.6" y2="142.4" stroke="#c0392b" stroke-width="2.6" marker-end="url(#old)" stroke-dasharray="7 4"/>
  <text x="613" y="134" font-size="12.5" fill="#c0392b" font-weight="600">&#964; 旧</text>
  <line x1="712.0" y1="232.0" x2="657.3" y2="177.4" stroke="#1f6fb2" stroke-width="3.2" marker-end="url(#new)"/>
  <text x="583" y="193" font-size="12.5" fill="#1f6fb2" font-weight="600">&#964; 修正後</text>
  <text x="712" y="372" font-size="12.5" fill="#111" font-weight="600" text-anchor="middle">軸のなす角 13.3&#176; &#8594; 別の軸まわりに回る</text>
  <text x="24" y="412" font-size="12.5" fill="#111">圧力中心が平面内だと、どちらのトルクも平面に垂直になるので平行になる</text>
  <text x="24" y="436" font-size="12" fill="#777">大きさの誤りも一定ではない。旧式は cos&#952; 比例、抜けていた成分は &#961;s cos&#178;&#952; を含む</text>
  <text x="24" y="456" font-size="12" fill="#777">入射角によって比が変わる</text>
</svg>

