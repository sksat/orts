[package]
name = "rrd-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "WebAssembly-friendly Rerun RRD decoder for streaming simulation data into browser viewers."
keywords = ["wasm", "rerun", "rrd", "decoder", "visualization"]
categories = ["wasm", "visualization"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Minimal rerun subcrate dependencies for decoding only — no rerun umbrella
re_log_encoding = { version = "0.33", features = ["decoder"] }
re_chunk = "0.33"
re_log_types = "0.33"
# `default-features = false` drops the default `ecolor` feature. This crate
# decodes scalars and text and never touches a colour type. It matters beyond
# this crate: features unify per build, so leaving it on here would pull ecolor
# back into every `--workspace` build even though `orts` opts out.
re_sdk_types = { version = "0.33", default-features = false }
# Required for wasm32 target (getrandom needs js feature for browser)
getrandom = { version = "0.3", features = ["wasm_js"] }

serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = { version = "0.6", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[features]
wasm = ["wasm-bindgen", "serde-wasm-bindgen"]

# Note: dev-dependencies do NOT affect wasm-pack builds (only used for `cargo test`)
# `re_sdk` writes the .rrd files the decoder tests read back, including the
# ragged recordings (a component logged at only some time steps) that no
# committed fixture can express. It is the same writer `orts` uses, and it
# brings `re_log_encoding`'s `encoder` feature that `save()` needs. `orts`
# itself is deliberately not a dev-dependency here: the decoder must stay
# testable against the RRD format, not against one producer's conventions.
[dev-dependencies]
re_sdk = "0.33"
# A directory of its own per written .rrd, removed when the test returns.
tempfile = "3"
