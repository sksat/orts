name: Deploy Site

on:
  push:
    branches: [main]
  # A deployment that stalls on GitHub's side fails the run for reasons the
  # commit had nothing to do with. This is the way back to a published site
  # without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_BASE_PATH: /orts/viewer/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up wild linker
        uses: ./.github/actions/setup-wild

      # This cache is a speed-up, not a guarantee: the repository sits over the
      # 10 GB cache limit (the per-job Cargo caches are 0.5-1.2 GB each), so LRU
      # eviction drops the textures often enough that a deploy fetching them from
      # NASA is the normal case rather than the exception. That is why the fetch
      # below has to survive a bad transfer on its own. TODO: if the fetch keeps
      # failing, publish the processed textures as a release asset and keep the
      # NASA/USGS sources in a regeneration workflow instead of the deploy path.
      - name: Cache viewer textures (4k/8k)
        id: texture-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            viewer/public/textures/earth_4k.jpg
            viewer/public/textures/earth_night_4k.jpg
            viewer/public/textures/earth_8k.jpg
            viewer/public/textures/earth_night_8k.jpg
            viewer/public/textures/moon_4k.jpg
            viewer/public/textures/moon_8k.jpg
            viewer/public/textures/sun_4k.jpg
          key: viewer-textures-${{ hashFiles('tools/fetch-textures.sh', '.github/workflows/deploy.yml') }}-${{ runner.os }}

      - name: Install ImageMagick (texture conversion — cache miss only)
        if: steps.texture-cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y imagemagick

      # One invocation for both resolutions: each source image is downloaded once
      # and resized twice. Two invocations re-downloaded the 21600x10800 Blue
      # Marble source for the 8k pass, doubling the exposure to hosts that drop
      # transfers. Sun has no 8k output, so this produces exactly the seven files
      # cached above.
      - name: Fetch viewer textures (4k/8k — skips mars to avoid 12 GB source)
        if: steps.texture-cache.outputs.cache-hit != 'true'
        run: ./tools/fetch-textures.sh --resolution 4k,8k --body earth,moon,sun

      - name: Parse rust-toolchain.toml
        id: rust-toolchain
        uses: ./.github/actions/parse-rust-toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown

      - name: Install Rust nightly (for rustdoc JSON)
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly

      # Shared with CI's build-site job, which builds the same site with the same
      # toolchain and only reads this entry. Keeping them on separate keys cost
      # 0.5 GB of a 10 GB budget the pull-request jobs are already over.
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: site

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Build site
        run: pnpm build:site
        env:
          VITE_TEXTURE_BASE_URL: ${{ env.VITE_BASE_PATH }}textures/
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The artifact name carries the attempt number because `deploy-pages`
      # lists the artifacts of the whole run, not of the current attempt, and
      # picks by name. With the default `github-pages`, a re-run uploads a second
      # artifact under the name the first attempt already used, and the deploy
      # step stops at "Multiple artifacts named github-pages were unexpectedly
      # found for this workflow run. Artifact count is 2." A run that failed for
      # a reason outside this repository therefore could not be recovered by
      # re-running it — which is how it failed: the deployment sat in
      # `updating_pages` until this action's own 10-minute cap (not raisable, v5
      # clamps `timeout` to 600000 ms) cancelled it.
      #
      # Splitting build and deploy into separate jobs would need this expression
      # reconsidered: under "Re-run failed jobs" the build would stay on the
      # earlier attempt while the deploy moved to the next one, and the deploy
      # would look for a name nothing uploaded.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: docs/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
