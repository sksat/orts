name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  # No base-branch filter: a stacked PR targets the branch below it in the
  # stack rather than main, and a `branches: [main]` filter would leave every
  # one of them with no checks at all.
  pull_request:
  # Lets the main/tag-only jobs — rust-dist above all — be exercised from a
  # topic branch before merging. Their ref guards are false on a PR, so the
  # release build path is otherwise unverified until it is already on main.
  workflow_dispatch:
  # Run the same checks on merge-queue groups so required checks are
  # validated against (main + queued PRs) before landing. The 14 PR
  # jobs have no event guard, so they run here too; the main/tag-only
  # jobs stay skipped (their ref guard is false for the queue branch).
  merge_group:

permissions:
  contents: write # softprops/action-gh-release (rust-dist, tag push only)

jobs:
  # Code quality checks: Rust (fmt, clippy) + TypeScript (biome).
  # clippy requires compilation, which overlaps with rust-build — accepted
  # trade-off for clear "lint = code quality" responsibility separation.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up wild linker
        uses: ./.github/actions/setup-wild

      - name: Parse rust-toolchain.toml
        id: rust-toolchain
        uses: ./.github/actions/parse-rust-toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace -- -D warnings

      # Contract check: `tobari` must compile warning-free at its non-default
      # tier. no-default-features disables both std and fetch-igrf, exercising
      # the vendored-data copy path in build.rs (the IGRF download/generate
      # helpers are `#[cfg(feature = "fetch-igrf")]`, so no dead_code here).
      - name: Clippy (tobari no_std)
        run: cargo clippy --locked -p tobari --no-default-features -- -D warnings

      # Contract checks: `arika` must compile at each feature tier.
      #   no_std, no alloc → pure math core only
      #   no_std + alloc   → + horizons, EopTable, HorizonsMoonEphemeris
      #   std (default)    → covered by the workspace clippy above
      - name: Clippy (arika no_std)
        run: cargo clippy --locked -p arika --no-default-features -- -D warnings

      - name: Clippy (arika no_std + alloc)
        run: cargo clippy --locked -p arika --no-default-features --features alloc -- -D warnings

      # Guards the no-alloc SGP4 propagation path: `sgp4` must build with only
      # `libm` (no std, no alloc).
      - name: Clippy (arika no_std + sgp4)
        run: cargo clippy --locked -p arika --no-default-features --features sgp4 -- -D warnings

      - name: Clippy (utsuroi no_std)
        run: cargo clippy --locked -p utsuroi --no-default-features -- -D warnings

      # Contract check: `orts` must still build with the sync-only
      # WASM backend (`plugin-wasm` without `plugin-wasm-async`). The
      # workspace default pulls `plugin-wasm-async` in via the CLI's
      # default features, so regressions to sync-only `#[cfg]` gates
      # would not be caught otherwise.
      - name: Clippy (orts sync-only plugin-wasm)
        run: cargo clippy --locked -p orts --no-default-features --features plugin-wasm -- -D warnings

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: "package.json"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm exec biome lint .

  # Supply-chain gate for the Rust side. Renovate's `minimumReleaseAge` cooldown
  # keeps a freshly published version out of the lockfile; this job is the
  # complementary check on what is already in it.
  #
  #   advisories — RustSec vulnerabilities / unmaintained crates
  #   bans       — wildcard version requirements (duplicate majors are warn-only)
  #   sources    — every crate must come from crates.io
  #
  # Licenses are deliberately not checked here: cli/about.toml already drives the
  # NOTICE embedded in the released binary, and one source of truth beats two.
  # Policy and documented exceptions live in deny.toml.
  #
  # Only the root workspace is covered; the nested plugin-sdk/examples workspace
  # has its own lockfile and is not checked yet.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse rust-toolchain.toml
        id: rust-toolchain
        uses: ./.github/actions/parse-rust-toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2.82.8
        with:
          tool: cargo-deny@0.20.2

      # One advisory evaluation, used for both the gate and the summary — the
      # advisory-database fetch and the license matching are the expensive part,
      # so they must not run twice. `-L info` is what makes cargo-deny mention
      # the advisories deny.toml ignores: at the default log level they are
      # invisible, so the exceptions we knowingly carry would vanish from view
      # the moment they were written down. The gate is cargo-deny's exit status.
      - name: cargo-deny (advisories)
        run: |
          set +e
          cargo deny --color never -L info check advisories 2>&1 | tee advisories.txt
          status=${PIPESTATUS[0]}
          set -e

          # `note[advisory-ignored]` is one per accepted exception; the RUSTSEC id
          # sits on the deny.toml line the diagnostic points at.
          accepted=$(grep -c '^note\[advisory-ignored\]' advisories.txt || true)
          # Count advisory categories only. A non-zero exit with none of these
          # means cargo-deny itself failed (advisory-db fetch, bad config) and
          # checked nothing — reporting that as "0 advisory errors" would read
          # like a clean security result.
          live=$(grep -cE '^error\[(vulnerability|unmaintained|unsound|notice|yanked)\]' advisories.txt || true)

          {
            if [ "$status" -eq 0 ]; then
              echo "### cargo-deny: advisories ok"
            elif [ "$live" -gt 0 ]; then
              echo "### cargo-deny: $live advisory finding(s)"
            else
              echo "### cargo-deny: check did not complete (exit $status, no advisory reported)"
            fi
            echo
            echo "Accepted exceptions (see \`deny.toml\` for why each one is there): $accepted"
            if [ "$accepted" -gt 0 ]; then
              echo
              grep -oE 'id = "RUSTSEC-[0-9-]+"' advisories.txt \
                | sed -E 's/id = "(.+)"/- [\1](https:\/\/rustsec.org\/advisories\/\1)/'
            fi
            echo
            echo '<details><summary>full cargo-deny output</summary>'
            echo
            echo '```'
            cat advisories.txt
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Cheap by comparison: no advisory database, no license matching. Runs
      # even when the advisory check failed, so one PR shows both results.
      - name: cargo-deny (bans, sources)
        if: always()
        run: cargo deny check bans sources

  rust-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The cleanup this wraps was added when ubuntu-latest shipped ~14 GB of
      # free disk, which the link phase of `cargo test --workspace --no-run`
      # filled. The image now starts with 87 GiB available (measured
      # 2026-09-02), so the action checks first and skips the 66-113 s cleanup
      # unless the headroom is actually gone.
      - name: Free disk space if low
        uses: ./.github/actions/free-disk-space-if-low

      - name: Set up wild linker
        uses: ./.github/actions/setup-wild

      - name: Parse rust-toolchain.toml
        id: rust-toolchain
        uses: ./.github/actions/parse-rust-toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-native
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build workspace
        run: cargo test --locked --workspace --no-run

      # What the cleanup threshold in free-disk-space-if-low is set against:
      # this is the workspace's heaviest link phase, so the headroom left here
      # says how much margin that threshold really has.
      - name: Report disk headroom after the build
        run: df -h /

      - name: Upload CLI binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orts-cli-debug
          path: target/debug/orts
          retention-days: 1

  # Reuses cargo cache from rust-build via shared-key to skip recompilation.
  # Split into two jobs: orts (heavy, ~20 min) runs alone while all
  # other crates share a single job (~3 min). New crates are
  # automatically included via --workspace.
  rust-test:
    runs-on: ubuntu-latest
    needs: [rust-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space if low
        uses: ./.github/actions/free-disk-space-if-low

      - name: Set up wild linker
        uses: ./.github/actions/setup-wild

      - name: Parse rust-toolchain.toml
        id: rust-toolchain
        uses: ./.github/actions/parse-rust-toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-native
          save-if: false

      - name: Test (all except orts)
        run: cargo test --locked --workspace --exclude orts

      # The SGP4 propagation tests (Vallado verification vectors) live behind
      # arika's optional `sgp4` feature; run them explicitly so they execute
      # regardless of which workspace members enable the feature.
      - name: Test (arika sgp4 feature)
        run: cargo test --locked -p arika --features sgp4

      # The orts-cli export tests above regenerate the ts-rs WebSocket
      # protocol bindings (viewer/src/protocol/generated/). A dirty tree
      # here means the Rust protocol types changed without regenerating
      # the TypeScript side: run `cargo test -p orts-cli` and commit.
      - name: Check generated protocol bindings are up to date
        run: git diff --exit-code viewer/src/protocol/generated

  # orts unit tests + doc tests + example unit tests (lightweight).
  rust-test-orts:
    runs-on: ubuntu-latest
    needs: [rust-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space if low
        uses: ./.github/actions/free-disk-space-if-low

      - name: Set up wild linker
        uses: ./.github/actions/setup-wild

      - name: Parse rust-toolchain.toml
        id: rust-toolchain
        uses: ./.github/actions/parse-rust-toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-native
          save-if: false

      - name: Test (orts unit + examples)
        run: cargo test --locked -p orts --lib --examples

      - name: Test (orts doc)
        run: cargo test --locked -p orts --doc

  # orts integration tests (heavy — each test propagates a
  # full simulation). Runs in parallel with the lightweight orts job.
  rust-test-orts-integration:
    runs-on: ubuntu-latest
    needs: [rust-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space if low
        uses: ./.github/actions/free-disk-space-if-low

      - name: Set up wild linker
        uses: ./.github/actions/setup-wild

      - name: Parse rust-toolchain.toml
        id: rust-toolchain
        uses: ./.github/actions/parse-rust-toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test (orts integration, release)
        run: cargo test --locked --release -p orts --tests

  # Plugin-wasm guest tests: build the bdot + pd-rw-control guest
  # components with cargo-component, then run the feature-gated
  # Rust integration tests that need a real WASM guest at runtime
  # (oracle sync↔async bit-exact, multi-sat scale, async context
  # safety). Separate from rust-test because it needs cargo-component
  # and a WASM target, and the signal "host API broke" is distinct
  # from "guest-facing ABI broke".
  rust-test-plugin-wasm:
    runs-on: ubuntu-latest
    needs: [rust-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space if low
        uses: ./.github/actions/free-disk-space-if-low

      - name: Set up wild linker
        uses: ./.github/actions/setup-wild

      - name: Parse rust-toolchain.toml
        id: rust-toolchain
        uses: ./.github/actions/parse-rust-toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: wasm32-wasip1

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-native
          save-if: false

      - name: Install cargo-component
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2.82.8
        with:
          tool: cargo-component@0.21.1

      - name: Build guest WASM components
        run: |
          cd plugin-sdk/examples && cargo component build --workspace --release

      - name: Run plugin-wasm integration tests
        run: |
          cargo test --locked -p orts --features plugin-wasm-async \
            --test oracle_plugin_wasm_bdot \
            --test oracle_plugin_wasm_pd_rw \
            --test wasm_async_backend \
            --test plugin_msg_commandable_mode \
            --test plugin_stream_framed \
            --test block_on_from_spawn_blocking

  # NOS3 ADCS SILS E2E: builds the NOS3 generic_adcs WASM plugin
  # (C FFI via wasi-sdk) and verifies B-dot detumbling reduces angular
  # velocity. Separate job because it needs wasi-sdk for C cross-compilation.
  # Runs on PRs using the debug CLI from rust-build (same pattern as
  # cli-plugin-backend-e2e) so wasi-sdk bumps and the C plugin build are
  # validated before merge rather than only post-merge. The B-dot check is
  # a correctness assertion, so the slower debug binary is acceptable.
  nos3-adcs-e2e:
    runs-on: ubuntu-latest
    needs: [rust-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up wild linker
        uses: ./.github/actions/setup-wild

      - name: Parse rust-toolchain.toml
        id: rust-toolchain
        uses: ./.github/actions/parse-rust-toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: wasm32-wasip1

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-native
          save-if: false

      - name: Install cargo-component
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2.82.8
        with:
          tool: cargo-component@0.21.1

      - name: Install wasi-sysroot
        run: |
          # renovate: datasource=github-releases depName=WebAssembly/wasi-sdk extractVersion=^wasi-sdk-(?<version>\d+)$
          WASI_SDK_VERSION=33
          # The sysroot asset gained a "+m" build-metadata suffix in wasi-sdk
          # v33 (wasi-sysroot-33.0+m.tar.gz); older releases have none. Try the
          # suffixed name first, then fall back, and adopt whatever single
          # top-level directory the tarball extracts to, so a version bump
          # alone does not break this step.
          base="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}"
          rm -rf /tmp/wasi-sysroot-extract && mkdir -p /tmp/wasi-sysroot-extract
          for name in "wasi-sysroot-${WASI_SDK_VERSION}.0+m" "wasi-sysroot-${WASI_SDK_VERSION}.0"; do
            if curl -sfL "${base}/${name}.tar.gz" -o /tmp/wasi-sysroot.tar.gz; then
              sudo tar xzf /tmp/wasi-sysroot.tar.gz -C /tmp/wasi-sysroot-extract
              inner=$(ls /tmp/wasi-sysroot-extract)
              sudo mv "/tmp/wasi-sysroot-extract/${inner}" /usr/share/wasi-sysroot
              break
            fi
          done
          test -d /usr/share/wasi-sysroot/include
          echo "WASI_SYSROOT=/usr/share/wasi-sysroot" >> "$GITHUB_ENV"

      - name: Download orts binary (debug)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: orts-cli-debug
          path: ./bin

      - name: Make orts binary executable
        run: chmod +x ./bin/orts

      - name: Build and test NOS3 ADCS plugin
        working-directory: plugin-sdk/examples/nos3-adcs
        env:
          ORTS_BIN: ${{ github.workspace }}/bin/orts
        run: ./test.sh all

  # CLI plugin-backend E2E: downloads the orts binary artifact built
  # by rust-build and exercises `orts run --plugin-backend=sync|async`
  # via subprocess. Mirrors the viewer-e2e pattern of "use the actual
  # shipped binary for end-to-end verification" rather than rebuilding
  # with cargo test. The test harness itself is still a Rust file
  # driven by cargo test, but the binary under test is injected via
  # the ORTS_BIN environment variable.
  cli-plugin-backend-e2e:
    runs-on: ubuntu-latest
    needs: [rust-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space if low
        uses: ./.github/actions/free-disk-space-if-low

      - name: Set up wild linker
        uses: ./.github/actions/setup-wild

      - name: Parse rust-toolchain.toml
        id: rust-toolchain
        uses: ./.github/actions/parse-rust-toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: wasm32-wasip1

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-native
          save-if: false

      - name: Install cargo-component
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2.82.8
        with:
          tool: cargo-component@0.21.1

      - name: Build guest WASM components
        run: |
          cd plugin-sdk/examples && cargo component build -p orts-example-plugin-pd-rw-control -p orts-example-plugin-commandable-mode-ff -p orts-example-plugin-stream-framed-commander --release

      # Real kble binary for the stream-bridge E2E. Installed via
      # cargo-binstall with the version resolved against crates.io;
      # Renovate bumps KBLE_VERSION via the custom regex manager in
      # renovate.json (crates datasource).
      - name: Install cargo-binstall
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2.82.8
        with:
          tool: cargo-binstall
      - name: Install kble
        run: |
          # renovate: datasource=crate depName=kble
          KBLE_VERSION=0.5.0
          cargo binstall --no-confirm "kble@${KBLE_VERSION}"

      # Named explicitly so the kble suites fail if the install ever puts the
      # binary somewhere else: their fallback is a PATH lookup, and finding
      # nothing there makes them soft-skip, which hides the breakage.
      - name: Point the kble suites at the binary
        run: echo "KBLE_BIN=$HOME/.cargo/bin/kble" >> "$GITHUB_ENV"

      - name: Download orts binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: orts-cli-debug
          path: ./bin

      - name: Make orts binary executable
        run: chmod +x ./bin/orts

      # One cargo invocation for every suite below, so the test targets
      # compile and link in parallel. Run as separate invocations they
      # serialize: each target is its own rustc, largely single-threaded,
      # so a per-suite `cargo test` leaves most of the runner idle and the
      # build cost adds up target by target. The per-suite invocations
      # that follow then find everything built and only run the tests.
      - name: Build CLI E2E test binaries
        run: |
          cargo test --locked -p orts-cli --no-run \
            --test plugin_backend_e2e \
            --test serve_dynamic_controlled_add_e2e \
            --test throughput_mode_speedup_e2e \
            --test e2e \
            --test plugin_msg_config_command_e2e \
            --test serve_stream_bridge_e2e \
            --test serve_kble_e2e \
            --test serve_kble_stdio_e2e \
            --test run_mode_e2e

      # This job carries both the test binaries and the guest WASM, so it is
      # the other place worth knowing the headroom at (see rust-build).
      - name: Report disk headroom after the build
        run: df -h /

      - name: Run CLI plugin-backend E2E
        env:
          ORTS_BIN: ${{ github.workspace }}/bin/orts
        run: |
          # The suites the build step above already compiled, in one
          # invocation. Nine separate ones each re-resolved the workspace
          # first, which measured 0.6 s apiece — small, but so is the reason to
          # repeat the same command nine times. Cargo still runs the binaries
          # one after another and prints `Running tests/<suite>.rs` before each,
          # so a failure still names its suite.
          #
          # `e2e` stays separate because it needs a filter, and a filter in a
          # combined invocation would apply to every target.
          #
          # run_mode_e2e's README quick-start and controller-config tests need
          # the guest WASM; under `rust-test`, which does not build it, they
          # soft-skip.
          cargo test --locked -p orts-cli \
            --test plugin_backend_e2e \
            --test serve_dynamic_controlled_add_e2e \
            --test throughput_mode_speedup_e2e \
            --test plugin_msg_config_command_e2e \
            --test serve_stream_bridge_e2e \
            --test serve_kble_e2e \
            --test serve_kble_stdio_e2e \
            --test run_mode_e2e
          cargo test --locked -p orts-cli --test e2e test_controlled_simulation_via_config

  # Build CLI with embedded viewer SPA in release profile.
  # Runs on main push (smoke test) AND tag push (release job consumes
  # the artifact). On PRs, build.rs falls back to a placeholder —
  # viewer embedding breakage is detected post-merge, not pre-merge.
  # Build CLI release binary for each target. Matrix produces one
  # artifact per target that the release job assembles into tarballs.

  # arm64 portability gate on a native arm64 runner, so this is a real build
  # rather than emulation.
  #
  # Narrower than the x86_64 jobs on purpose: it builds the whole workspace and
  # runs the unit and doc tests. The integration suites are the slowest jobs in
  # CI and cover physics and protocol behaviour, which does not vary by
  # architecture. What does vary is compilation, pointer width, endianness and
  # intrinsics, and these tests cover that.
  rust-test-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up wild linker
        uses: ./.github/actions/setup-wild

      - name: Free disk space if low
        uses: ./.github/actions/free-disk-space-if-low

      - name: Parse rust-toolchain.toml
        id: rust-toolchain
        uses: ./.github/actions/parse-rust-toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      # Its own cache namespace: a different architecture shares no artifacts
      # with the x86_64 jobs.
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-arm64
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test (all except orts)
        run: cargo test --locked --workspace --exclude orts

      - name: Test (orts unit + doc)
        run: |
          cargo test --locked -p orts --lib
          cargo test --locked -p orts --doc

  # macOS portability gate on macos-latest (arm64).
  #
  # Same scope as rust-test-arm64: the whole workspace plus unit and doc tests.
  # The integration suites stay Linux-only — they are the slowest jobs in CI and
  # cover physics and protocol behaviour, which does not vary by platform. What
  # does vary is compilation, path handling and process spawning, and these
  # tests reach that.
  #
  # No wild here: `.cargo/config.toml` scopes its linker line to the Linux gnu
  # triples, so darwin links with Apple's ld.
  rust-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse rust-toolchain.toml
        id: rust-toolchain
        uses: ./.github/actions/parse-rust-toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      # Its own cache namespace: a different platform shares no artifacts with
      # the Linux jobs.
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test (all except orts)
        run: cargo test --locked --workspace --exclude orts

      - name: Test (orts unit + doc)
        run: |
          cargo test --locked -p orts --lib
          cargo test --locked -p orts --doc

  # Windows portability gate on windows-latest (x86_64 msvc).
  #
  # Same scope as rust-test-arm64 and rust-test-macos: the non-orts tests plus
  # orts' unit and doc tests. The integration suites stay Linux-only. Several of
  # them drive the `kble` bridge over stdio, which is where the platform
  # assumptions actually live, and they are the slowest jobs in CI besides.
  #
  # No wild here either: `.cargo/config.toml` scopes its linker line to the
  # Linux gnu triples, so msvc links with link.exe.
  rust-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse rust-toolchain.toml
        id: rust-toolchain
        uses: ./.github/actions/parse-rust-toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test (all except orts)
        run: cargo test --locked --workspace --exclude orts

      - name: Test (orts unit + doc)
        run: |
          cargo test --locked -p orts --lib
          cargo test --locked -p orts --doc

  rust-dist:
    if: >-
      github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/v')
      || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    needs: [rust-build, viewer-build]
    strategy:
      matrix:
        # `include` rather than a bare target list: each target names the runner
        # it builds on. macos-latest is arm64 and its Xcode carries both macOS
        # SDKs, so it produces the x86_64 binary too and no Intel runner is
        # needed.
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the musl target compiles on the host. The gnu target runs cargo
      # inside the `cross` container, which overrides RUSTFLAGS and links with
      # cc. Both matrix entries are x86_64.
      - name: Set up wild linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: ./.github/actions/setup-wild

      # Linux-only action. The dist build also holds the `cross` image, so it is
      # the one job whose headroom is worth cleaning when it runs short.
      - name: Free disk space if low
        if: runner.os == 'Linux'
        uses: ./.github/actions/free-disk-space-if-low

      # gnu is built via `cross` so its glibc floor is pinned and
      # host-independent (see Cross.toml); no host wild/clang needed. musl
      # stays a native static build.
      - name: Install cross (gnu target)
        if: endsWith(matrix.target, '-unknown-linux-gnu')
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2.82.8
        with:
          # Pinned: this PR's point is a reproducible, host-independent gnu
          # build, so the cross CLI version is fixed alongside the pinned
          # container image in Cross.toml (0.2.5 is the current cross release).
          tool: cross@0.2.5

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Parse rust-toolchain.toml
        id: rust-toolchain
        uses: ./.github/actions/parse-rust-toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      # This job builds from scratch on purpose. Its six per-target Cargo caches
      # held ~4 GB of the repository's 10 GB budget, which the whole workflow is
      # over, so entries are evicted within minutes of being written. What the
      # budget has to cover first is the pull-request critical path: a missing
      # rust-windows cache costs 864 s that someone is waiting on, against
      # ~600 s per target here (measured ~250 s cached vs ~850 s cold) on a job
      # that runs after review, on main pushes and tags, with all six targets in
      # parallel.

      # The third-party license notice is generated from build.rs via the
      # cargo-about *library* (a build-dependency of orts-cli), so no
      # `cargo about` binary needs to be installed for either target.

      - name: Download viewer dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: viewer-dist
          path: ./viewer/dist

      - name: Build CLI with embedded viewer (gnu, via cross)
        if: endsWith(matrix.target, '-unknown-linux-gnu')
        env:
          ORTS_REQUIRE_LICENSE_NOTICE: "1"
          # .cargo/config.toml's clang+wild rustflags line can't run in the
          # container; a non-empty RUSTFLAGS replaces it, falling back to
          # cc/gcc. Must be non-empty (empty is ignored); target-cpu=x86-64 is
          # the default baseline no-op. Forwarded via Cross.toml passthrough.
          RUSTFLAGS: >-
            ${{ matrix.target == 'aarch64-unknown-linux-gnu'
                && '-Ctarget-cpu=generic'
                || '-Ctarget-cpu=x86-64' }}
        run: cross build --locked --release -p orts-cli --target ${{ matrix.target }}

      - name: Build CLI with embedded viewer (musl, native static)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          ORTS_REQUIRE_LICENSE_NOTICE: "1"
        run: cargo build --locked --release -p orts-cli --target ${{ matrix.target }}

      # Both darwin targets build with plain cargo on the arm64 runner; the
      # x86_64 one is a cross-compile against the SDK Xcode already ships.
      # Stripped here rather than in the release job: that job runs on Linux,
      # whose GNU strip cannot read Mach-O.
      - name: Build CLI with embedded viewer (darwin)
        if: endsWith(matrix.target, '-apple-darwin')
        env:
          ORTS_REQUIRE_LICENSE_NOTICE: "1"
        run: |
          cargo build --locked --release -p orts-cli --target ${{ matrix.target }}
          strip -x "target/${{ matrix.target }}/release/orts"

      # No strip: MSVC keeps debug info in a separate .pdb, which is not shipped.
      - name: Build CLI with embedded viewer (windows)
        if: endsWith(matrix.target, '-pc-windows-msvc')
        env:
          ORTS_REQUIRE_LICENSE_NOTICE: "1"
        run: cargo build --locked --release -p orts-cli --target ${{ matrix.target }}

      - name: Upload CLI binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orts-cli-release-${{ matrix.target }}
          path: >-
            target/${{ matrix.target }}/release/orts${{
              endsWith(matrix.target, '-pc-windows-msvc') && '.exe' || '' }}
          retention-days: 1

  # Verify crate package contents before release. Runs on a clean
  # checkout (no downloaded artifacts) so --allow-dirty is not needed.
  crate-package-verify:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse rust-toolchain.toml
        id: rust-toolchain
        uses: ./.github/actions/parse-rust-toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: List crate package contents
        run: |
          mkdir -p /tmp/crate-pkg
          for toml in */Cargo.toml plugin-sdk/Cargo.toml; do
            crate=$(awk -F'"' '/^name[[:space:]]*=/ {print $2; exit}' "$toml")
            [ -z "$crate" ] && continue
            if cargo package --list -p "$crate" > "/tmp/crate-pkg/${crate}.txt" 2>/dev/null; then
              echo "--- $crate ($(wc -l < /tmp/crate-pkg/${crate}.txt) files) ---"
              cat "/tmp/crate-pkg/${crate}.txt"
            else
              echo "--- $crate (skipped: deps not on crates.io) ---"
              rm -f "/tmp/crate-pkg/${crate}.txt"
            fi
          done

      - name: Verify no unexpected files in crate packages
        run: |
          BAD_PATTERNS='\.venv/|__pycache__|\.pytest_cache|node_modules|\.DS_Store'
          FAIL=0
          for f in /tmp/crate-pkg/*.txt; do
            crate=$(basename "$f" .txt)
            bad=$(grep -E "$BAD_PATTERNS" "$f" || true)
            if [ -n "$bad" ]; then
              echo "::error::Unexpected files in $crate tarball:"
              echo "$bad"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] && echo "All crate package contents clean."
          exit $FAIL

  # Build example WASM plugin guests for inclusion in the release tarball.
  build-example-plugins:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up wild linker
        uses: ./.github/actions/setup-wild

      - name: Parse rust-toolchain.toml
        id: rust-toolchain
        uses: ./.github/actions/parse-rust-toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: wasm32-wasip1

      - name: Install cargo-component
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2.82.8
        with:
          tool: cargo-component@0.21.1

      - name: Build example WASM plugins
        run: |
          cd plugin-sdk/examples && cargo component build --workspace --release

      - name: Upload example plugins
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: example-plugins
          path: plugin-sdk/examples/target/wasm32-wasip1/release/orts_example_plugin_*.wasm
          retention-days: 1

  starlight-rustdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: "package.json"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter starlight-rustdoc build

      - name: Test
        run: pnpm --filter starlight-rustdoc test

      # `astro build` does not type-check, so the docs site's `.astro`/`.ts`
      # sources were never gated. Run `astro check` here — this job already
      # builds the `starlight-rustdoc` plugin that `astro.config.mjs` imports,
      # and the check skips the (Rust-dependent) rustdoc generation via
      # STARLIGHT_RUSTDOC_SKIP, so it needs no toolchain beyond Node.
      - name: Typecheck docs site (astro check)
        run: pnpm --filter orts-docs check

  # Build the full docs site (astro/starlight) on PRs. The Deploy Site
  # workflow only builds on push to main, so a docs-build regression — e.g.
  # a Starlight sidebar schema change — would otherwise not surface until
  # after merge (the required `starlight-rustdoc` check builds the
  # starlight-rustdoc *package*, not the orts docs site). Path-gated: the
  # heavy build runs only when docs-affecting files change; on unrelated PRs
  # the job exits early as a success so the required check still passes. The
  # job always runs (only inner steps are conditional) to avoid the
  # skipped-required-check ambiguity. Textures and the Pages deploy are
  # omitted — this validates the build, it does not publish.
  build-site:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    env:
      VITE_BASE_PATH: /orts/viewer/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect docs-affecting changes
        id: changes
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            merge_group)  base="${{ github.event.merge_group.base_sha }}" ;;
            *)            base="" ;;
          esac
          if [ -z "$base" ] || ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
            echo "Base ref unavailable; building to be safe."
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed files:"; echo "$changed"
          # Inputs the docs site build consumes: docs config/content, the
          # local starlight-rustdoc plugin (imported by astro.config.mjs), the
          # embedded viewer/tobari demos, the typedoc source (uneri), JS deps
          # (manifest + lockfile), and this workflow itself. NOTE: this does
          # not gate on Rust crate sources, so a rustdoc-content regression
          # driven purely by a doc-comment change is not caught here.
          if echo "$changed" | grep -qE '^(docs/|starlight-rustdoc/|viewer/|uneri/|tobari/|package\.json|pnpm-lock\.yaml|\.github/workflows/ci\.yml)'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No docs-affecting changes — skip site build
        if: steps.changes.outputs.docs != 'true'
        run: echo "No docs-affecting files changed; skipping site build (required check passes)."

      - name: Setup pnpm
        if: steps.changes.outputs.docs == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Setup Node.js
        if: steps.changes.outputs.docs == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.docs == 'true'
        run: pnpm install --frozen-lockfile

      - name: Set up wild linker
        if: steps.changes.outputs.docs == 'true'
        uses: ./.github/actions/setup-wild

      - name: Parse rust-toolchain.toml
        if: steps.changes.outputs.docs == 'true'
        id: rust-toolchain
        uses: ./.github/actions/parse-rust-toolchain

      - name: Install Rust
        if: steps.changes.outputs.docs == 'true'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown

      - name: Install Rust nightly (for rustdoc JSON)
        if: steps.changes.outputs.docs == 'true'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly

      # Same key as the Pages deploy's site build (identical toolchain, targets
      # and `pnpm build:site`), so the two share one entry instead of holding
      # 0.5 GB each. The deploy on main is the producer; this job consumes, which
      # also stops a docs-touching pull request from writing a branch-scoped
      # 0.5 GB copy that only that branch can read.
      - name: Cache Cargo artifacts
        if: steps.changes.outputs.docs == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: site
          save-if: false

      - name: Install wasm-pack
        if: steps.changes.outputs.docs == 'true'
        uses: ./.github/actions/install-wasm-pack

      - name: Build site
        if: steps.changes.outputs.docs == 'true'
        run: pnpm build:site
        env:
          VITE_TEXTURE_BASE_URL: ${{ env.VITE_BASE_PATH }}textures/

  uneri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: "package.json"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter uneri build

      - name: Test
        run: pnpm --filter uneri test

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uneri-dist
          path: uneri/dist/
          retention-days: 1

  viewer-build:
    runs-on: ubuntu-latest
    needs: [uneri]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up wild linker
        uses: ./.github/actions/setup-wild

      - name: Parse rust-toolchain.toml
        id: rust-toolchain
        uses: ./.github/actions/parse-rust-toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: wasm-viewer
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: "package.json"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download uneri dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uneri-dist
          path: ./uneri/dist

      - name: Build viewer
        run: pnpm --filter orts-viewer build

      - name: Test viewer
        run: pnpm --filter orts-viewer test

      # The registry-consumer example is only exercised via Playwright (a Vite
      # build, which does not type-check), so its `tsc --noEmit` was ungated —
      # a TypeScript 6 deprecation error in its tsconfig slipped through here.
      # Run its typecheck so config/type regressions fail at build time.
      - name: Typecheck registry-consumer example
        working-directory: viewer/examples/orbit-viewer
        run: pnpm typecheck

      # The shadcn registry manifest is generated from the library's import
      # closure; build it (proves it's well-formed) and fail if the committed
      # registry.json drifted from the closure (someone changed imports without
      # re-running registry:gen).
      - name: Verify shadcn registry
        run: |
          pnpm --filter orts-viewer run registry:build
          git diff --exit-code -- viewer/registry.json

      - name: Upload viewer dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viewer-dist
          path: viewer/dist/
          retention-days: 1

  tobari-example-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up wild linker
        uses: ./.github/actions/setup-wild

      - name: Parse rust-toolchain.toml
        id: rust-toolchain
        uses: ./.github/actions/parse-rust-toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: "package.json"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter tobari-example-web build

      - name: Test
        run: pnpm --filter tobari-example-web test

  uneri-e2e:
    runs-on: ubuntu-latest
    needs: [uneri]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: "package.json"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download uneri dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uneri-dist
          path: ./uneri/dist

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: uneri
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: uneri
        run: npx playwright install-deps chromium

      - name: Run Playwright E2E
        working-directory: uneri
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uneri-playwright-report
          path: uneri/test-results/
          retention-days: 7

  viewer-e2e:
    runs-on: ubuntu-latest
    needs: [rust-build, uneri]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up wild linker
        uses: ./.github/actions/setup-wild

      - name: Parse rust-toolchain.toml
        id: rust-toolchain
        uses: ./.github/actions/parse-rust-toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: wasm-viewer
          save-if: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: "package.json"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download uneri dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uneri-dist
          path: ./uneri/dist

      - name: Build WASM
        run: pnpm --filter orts-viewer build:wasm

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: viewer
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: viewer
        run: npx playwright install-deps chromium

      - name: Download CLI binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: orts-cli-debug
          path: ./bin

      - name: Make CLI binary executable
        run: chmod +x ./bin/orts

      - name: Start WebSocket server
        # The high-res source textures (21600x10800 for Earth alone) compete with
        # the simulation loop for CPU while they download and decode, which starves
        # the stream the next step waits on. Embedded 2k textures are served either
        # way. See issue #373.
        env:
          ORTS_DISABLE_TEXTURE_DOWNLOAD: "1"
        run: ./bin/orts serve --sat altitude=400 --dt 1 --output-interval 10 &

      - name: Wait for WebSocket server to stream
        # `nc -z` only checks the port is bound (TcpListener::bind), which happens
        # before the simulation manager is ready to stream. Wait until a client
        # actually receives a `state` message so tests don't connect too early.
        # See issue #65.
        run: node .github/scripts/wait-ws-stream.mjs ws://localhost:9001/ws

      - name: Start Vite dev server
        run: VITE_WS_URL=ws://localhost:9001/ws pnpm --filter orts-viewer dev &

      - name: Wait for Vite server
        run: |
          for _ in $(seq 1 60); do
            if curl -sf --max-time 2 http://localhost:5173/ -o /dev/null; then
              echo "Vite server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Vite server failed to start"
          exit 1

      - name: Run Playwright E2E
        working-directory: viewer
        run: npx playwright test
        env:
          VIEWER_PORT: "5173"
          ORTS_WS_URL: "ws://localhost:9001/ws"
          ORTS_BINARY: "${{ github.workspace }}/bin/orts"

      # The registry-consumer example is a standalone package that imports the
      # shadcn-distributed source (committed under components/orbit-viewer) and
      # serves itself on its own Vite — this exercises the copied registry output
      # end to end. Backend-free; reuses the wasm/Playwright setup above.
      - name: Run registry-consumer example E2E
        working-directory: viewer/examples/orbit-viewer
        run: npx playwright test
        env:
          EXAMPLE_PORT: "5273"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viewer-playwright-report
          path: |
            viewer/test-results/
            viewer/examples/orbit-viewer/test-results/
          retention-days: 7

  # Verify that npm packages can be published. Runs after build jobs
  # so dist/ artifacts are available. Catches metadata issues, missing
  # files, and registry misconfigurations before release.
  npm-publish-dry-run:
    runs-on: ubuntu-latest
    needs: [uneri, starlight-rustdoc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: "package.json"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download uneri dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uneri-dist
          path: ./uneri/dist

      - name: Build starlight-rustdoc
        run: pnpm --filter starlight-rustdoc build

      - name: Publish dry-run (uneri)
        run: pnpm --filter uneri publish --dry-run --no-git-checks --registry https://registry.npmjs.org/

      - name: Publish dry-run (starlight-rustdoc)
        run: pnpm --filter starlight-rustdoc publish --dry-run --no-git-checks --registry https://registry.npmjs.org/

  # ── Release (tag push only) ──────────────────────────────────
  # Package the release binary and create a draft GitHub Release.
  # Downloads the artifact from rust-dist — the released binary is the
  # exact same one that CI built and validated.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - rust-dist
      - build-example-plugins
      - crate-package-verify
      - npm-publish-dry-run
      - rust-test
      - rust-test-orts
      - rust-test-orts-integration
      - rust-test-plugin-wasm
      - viewer-e2e
      - cli-plugin-backend-e2e
      - rust-test-arm64
      - rust-test-macos
      - rust-test-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Non-cone mode so individual files are checked out by exact path,
          # including `.github/release-body.md.tmpl`. Leading `/` anchors each
          # pattern to the repo root (cone mode only takes directories, so it
          # would not pull the template).
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /LICENSE
            /Cargo.toml
            /CHANGELOG.md
            /CHANGELOG.ja.md
            /.github/release-body.md.tmpl

      - name: Extract version from tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify Cargo.toml version matches tag
        run: |
          set -euo pipefail
          CARGO_VERSION=$(awk -F'"' '
            /^\[workspace\.package\]/ { in_wp = 1; next }
            /^\[/ { in_wp = 0 }
            in_wp && /^version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "${CARGO_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match Cargo.toml workspace version (${CARGO_VERSION})"
            exit 1
          fi

      - name: Extract changelog for this version
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the section between ## [VERSION] and the next ## [.
          # Two-pass: first try the exact version heading, then fall back
          # to [Unreleased] if no version-specific section exists.
          extract_section() {
            local file="$1" heading="$2"
            awk -v heading="$heading" '
              BEGIN { found=0 }
              /^## \[/ {
                if (found) exit
                if ($0 ~ "\\[" heading "\\]") found=1
                next
              }
              found { print }
            ' "$file"
          }
          # English
          BODY_EN=$(extract_section CHANGELOG.md "$VERSION")
          if [ -z "$BODY_EN" ]; then
            BODY_EN=$(extract_section CHANGELOG.md "Unreleased")
          fi
          echo "$BODY_EN" > /tmp/changelog-en.txt
          # Japanese
          BODY_JA=""
          if [ -f CHANGELOG.ja.md ]; then
            BODY_JA=$(extract_section CHANGELOG.ja.md "$VERSION")
            if [ -z "$BODY_JA" ]; then
              BODY_JA=$(extract_section CHANGELOG.ja.md "Unreleased")
            fi
          fi
          echo "$BODY_JA" > /tmp/changelog-ja.txt
          echo "Extracted EN=$(wc -l < /tmp/changelog-en.txt) JA=$(wc -l < /tmp/changelog-ja.txt) lines"

      - name: Download example plugins
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: example-plugins
          path: ./plugins-wasm

      - name: Download CLI binary (gnu)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: orts-cli-release-x86_64-unknown-linux-gnu
          path: ./bin-gnu

      - name: Download CLI binary (musl)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: orts-cli-release-x86_64-unknown-linux-musl
          path: ./bin-musl

      - name: Download CLI binary (arm64 gnu)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: orts-cli-release-aarch64-unknown-linux-gnu
          path: ./bin-arm64-gnu

      - name: Download CLI binary (arm64 darwin)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: orts-cli-release-aarch64-apple-darwin
          path: ./bin-arm64-darwin

      - name: Download CLI binary (x86_64 darwin)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: orts-cli-release-x86_64-apple-darwin
          path: ./bin-x86_64-darwin

      - name: Download CLI binary (windows msvc)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: orts-cli-release-x86_64-pc-windows-msvc
          path: ./bin-windows

      # The release runner is x86_64, so its `strip` cannot touch the arm64
      # binary.
      - name: Install arm64 binutils
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Create tarballs and checksums
        id: assets
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ALL_FILES=""

          for TARGET in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl \
                        aarch64-unknown-linux-gnu \
                        aarch64-apple-darwin x86_64-apple-darwin \
                        x86_64-pc-windows-msvc; do
            # Match the full triple: `*gnu` alone would catch both gnu targets.
            # The darwin binaries were stripped on the macOS runner, since this
            # job's GNU strip cannot read Mach-O — hence the `:` no-op.
            case "$TARGET" in
              x86_64-unknown-linux-gnu)  BIN_DIR=bin-gnu;          STRIP=strip ;;
              x86_64-unknown-linux-musl) BIN_DIR=bin-musl;         STRIP=strip ;;
              aarch64-unknown-linux-gnu) BIN_DIR=bin-arm64-gnu;    STRIP=aarch64-linux-gnu-strip ;;
              aarch64-apple-darwin)      BIN_DIR=bin-arm64-darwin; STRIP=: ;;
              x86_64-apple-darwin)       BIN_DIR=bin-x86_64-darwin; STRIP=: ;;
              x86_64-pc-windows-msvc)    BIN_DIR=bin-windows;      STRIP=: ;;
              *) echo "unhandled target: $TARGET" >&2; exit 1 ;;
            esac

            case "$TARGET" in
              *-pc-windows-*) EXE=.exe ;;
              *)              EXE= ;;
            esac

            STAGE_DIR="orts-cli-${VERSION}-${TARGET}"
            mkdir -p "${STAGE_DIR}/examples/plugins"

            cp "${BIN_DIR}/orts${EXE}" "${STAGE_DIR}/orts${EXE}"
            chmod +x "${STAGE_DIR}/orts${EXE}"
            "$STRIP" "${STAGE_DIR}/orts${EXE}"
            cp README.md "${STAGE_DIR}/README.md"
            cp LICENSE "${STAGE_DIR}/LICENSE"

            # Rename plugin wasm files: strip orts_example_plugin_ prefix, use hyphens
            for f in $(find plugins-wasm -name 'orts_example_plugin_*.wasm' -not -path '*/deps/*'); do
              base=$(basename "$f" .wasm)
              short=$(echo "$base" | sed 's/^orts_example_plugin_//' | tr '_' '-')
              cp "$f" "${STAGE_DIR}/examples/plugins/${short}.wasm"
            done

            # Every target gets a tarball, including Windows. That is what
            # keeps the cargo-binstall metadata free of per-target exceptions:
            # one `pkg-fmt = "tgz"` covers the whole matrix.
            ARCHIVE="${STAGE_DIR}.tar.gz"
            tar --sort=name \
                --owner=0 --group=0 --numeric-owner \
                --mtime='UTC 2020-01-01' \
                -czf "${ARCHIVE}" "${STAGE_DIR}"
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
            cat "${ARCHIVE}.sha256"
            ALL_FILES="${ALL_FILES}${ARCHIVE}\n${ARCHIVE}.sha256\n"

            # Windows additionally gets a zip, since Explorer cannot expand a
            # .tar.gz from its context menu. Wraps STAGE_DIR like the tarball so
            # one `bin-dir` template resolves in both. -X drops extra file
            # attributes, but timestamps remain, so unlike the tarballs with
            # their fixed --mtime this is not byte-reproducible.
            if [ "$EXE" = ".exe" ]; then
              ZIP="${STAGE_DIR}.zip"
              zip -qrX "${ZIP}" "${STAGE_DIR}"
              sha256sum "${ZIP}" > "${ZIP}.sha256"
              cat "${ZIP}.sha256"
              ALL_FILES="${ALL_FILES}${ZIP}\n${ZIP}.sha256\n"
            fi

            # Standalone binary
            BINARY="orts-${TARGET}${EXE}"
            cp "${STAGE_DIR}/orts${EXE}" "${BINARY}"
            ALL_FILES="${ALL_FILES}${BINARY}\n"
          done

          echo -e "$ALL_FILES" | grep -v '^$' > /tmp/release-files.txt
          cat /tmp/release-files.txt

          # Hand the list to the release step rather than repeating the targets
          # there. A hardcoded list silently drops any target added later:
          # fail_on_unmatched_files only catches a listed file that is missing,
          # never a produced file that was never listed.
          {
            echo "files<<ASSETS_EOF"
            cat /tmp/release-files.txt
            echo "ASSETS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build release body
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          cp .github/release-body.md.tmpl /tmp/release-body.md
          sed -i "s/{{VERSION}}/${VERSION}/g" /tmp/release-body.md
          # Inject the extracted changelogs verbatim in place of the
          # placeholder lines: for the matched line, `r` queues the file
          # (copied as-is, so its markdown/backticks are not re-interpreted)
          # and `d` drops the placeholder.
          sed -i -e '/{{CHANGELOG_EN}}/{' -e 'r /tmp/changelog-en.txt' -e 'd' -e '}' /tmp/release-body.md
          sed -i -e '/{{CHANGELOG_JA}}/{' -e 'r /tmp/changelog-ja.txt' -e 'd' -e '}' /tmp/release-body.md

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body_path: /tmp/release-body.md
          files: |
            ${{ steps.assets.outputs.files }}
            README.md
            LICENSE
