[workspace]
resolver = "2"
members = [
    "utsuroi",
    "arika",
    "arika/wasm",
    "cli",
    "orts",
    "tobari",
    "tobari/wasm",
    "rrd-wasm",
    "plugin-sdk",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.91.0"
license = "MIT"
repository = "https://github.com/sksat/orts"
homepage = "https://sksat.github.io/orts/"
authors = ["sksat <sksat@sksat.net>"]

# Build scripts and their dependencies are compiled with opt-level 0 by default
# — in every profile, release included. `cli/build.rs` runs the cargo-about
# license gatherer in-process (three passes: the native graph plus each bundled
# wasm crate), and askalono's license matching is CPU-bound text comparison, so
# unoptimized it dominates every orts-cli build. Optimizing the build-script
# graph trades a one-time compile for a much cheaper build.rs run.
[profile.dev.build-override]
opt-level = 2

[profile.release.build-override]
opt-level = 2

[workspace.dependencies]
# Internal workspace crates: path for local resolution + version for crates.io
# publish. The version is kept in sync with [workspace.package] version above.
utsuroi = { path = "utsuroi", version = "=0.2.0" }
arika = { path = "arika", version = "=0.2.0" }
orts = { path = "orts", version = "=0.2.0" }
tobari = { path = "tobari", version = "=0.2.0" }
nalgebra = "0.35"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "fs", "io-util"] }
tokio-tungstenite = "0.29"
kble-socket = { version = "0.5", features = ["stdio", "tungstenite"] }
bytes = "1"
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
# rerun subcrates instead of the `rerun` umbrella: the umbrella re-exports
# re_entity_db / re_capabilities with no #[cfg], so even features = ["sdk"]
# drags in re_query, re_chunk_store, re_video, image, re_analytics...
# Same approach rrd-wasm already takes.
re_sdk = "0.33"
# `default-features = false` drops re_sdk_types' default `ecolor` feature, and
# with it the ecolor crate. `emath` stays either way — re_sdk_types depends on
# it unconditionally. re_sdk_types is the only one of these five with a
# non-empty default, and `re_sdk` itself depends on it this way, so this is what
# the umbrella already resolved to. orts uses only Scalars / Points3D /
# TextDocument / Scalar / Text, none of which need a colour type.
#
# rrd-wasm opts out too. Features unify per build, so one member leaving the
# default on would pull ecolor back into every `--workspace` build.
re_sdk_types = { version = "0.33", default-features = false }
# `decoder` is orts' own requirement (DecoderApp); `encoder` comes from re_sdk
# anyway but is named here because save_as_rrd depends on it directly.
re_log_encoding = { version = "0.33", features = ["encoder", "decoder"] }
re_chunk = "0.33"
re_log_types = "0.33"
ureq = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "tiff"] }
toml = "1.0"
serde_yaml = "0.9"
rust-embed = { version = "8", features = ["mime-guess", "include-exclude"] }
thiserror = "2"
# WebSocket protocol type codegen (Rust → TypeScript). Generated bindings
# land in viewer/src/protocol/generated/ via TS_RS_EXPORT_DIR (set in
# .cargo/config.toml) whenever `cargo test -p orts-cli` runs.
ts-rs = { version = "12", features = ["serde-json-impl"] }

# wasmtime: Pulley single-backend + Component Model. Cranelift is
# enabled for runtime compile path (plugin-wasm default), runtime-only
# deployments that load pre-compiled .cwasm artefacts are built by
# turning off `cranelift`/`wat`/`anyhow` via cargo feature unification.
# `anyhow` is required because wasmtime's public API (e.g. Module::new,
# Engine::precompile_component) returns `anyhow::Error`.
# See DESIGN.md Phase P for the rationale. Minor-pinned so that
# `cargo update` picks up patch fixes (including security) automatically.
wasmtime-wasi = { version = "~46.0.0", default-features = false }
wasmtime = { version = "~46.0.0", default-features = false, features = [
    "runtime",
    "cranelift",
    "pulley",
    "component-model",
    "std",
    "wat",
    "anyhow",
] }
