[package]
name = "arika"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Coordinate frames, reference transforms, epochs, and celestial body ephemerides for orbital mechanics."
keywords = ["coordinates", "ephemeris", "astronomy", "geodesy", "orbital"]
categories = ["science", "science::geo"]

[dependencies]
nalgebra = { version = "0.35", default-features = false, features = ["libm"] }
serde = { version = "1", default-features = false, features = ["derive"] }
# OMM JSON parsing (arika::omm::json). no_std via `alloc`; pulled in only when
# the `alloc` feature is on (the element-set parsers live behind `alloc`).
serde_json = { version = "1", default-features = false, features = [
    "alloc",
], optional = true }
libm = "0.2"
ureq = { workspace = true, optional = true }
# SGP4/SDP4 propagation (arika::sgp4). Aliased as `sgp4_rs` so the `arika::sgp4`
# module can own the `sgp4` name. Pulled with only `libm` (never the crate's
# `std`, which conflicts with `libm`), so it builds in every arika tier
# including no_std without `alloc`.
sgp4_rs = { package = "sgp4", version = "2.4", default-features = false, features = [
    "libm",
], optional = true }

[dev-dependencies]
serde_json.workspace = true
trybuild = "1.0.116"

[features]
default = ["std"]
std = ["alloc", "nalgebra/std", "serde/std", "serde_json?/std"]
alloc = ["serde/alloc", "dep:serde_json"]
fetch-horizons = ["std", "dep:ureq"]
# IERS finals2000A.all download + cache (arika::earth::eop::EopTable::fetch).
fetch-eop = ["std", "dep:ureq"]
# SGP4/SDP4 propagation via the `sgp4` crate (arika::sgp4). Optional and off by
# default to keep minimal / wasm builds lean.
sgp4 = ["dep:sgp4_rs"]
